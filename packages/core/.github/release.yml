changelog:
  exclude:
    labels:
      - tagpr
      - skip:core
  categories:
    - title: Breaking Changes 🛠
      labels:
        - breaking change
    - title: New Features 🚀
      labels:
        - enhancement
    - title: Fix bug 🐛
      labels:
        - bug
    - title: Dependency Updates ⬆️
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
